name: Deploy TV Shows to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "week-1/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: week-1
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: week-1
          node-version: "24"
          cache: true
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Build request library
        working-directory: week-1/packages/useQuery
        run: vp run build
      - name: Build app
        working-directory: week-1/apps/tv-shows
        run: vp run build
      - name: Check code
        run: vp check
      - name: Check file lengths
        run: vp run check:lines
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: week-1/apps/tv-shows/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
